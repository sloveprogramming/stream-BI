name: bisql
version: "1.0.0"
config-version: 2

# 与 backend/dbt/profiles.yml 里的 profile 名对应
profile: bisql

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
log-path: "logs"
clean-targets: ["target", "dbt_packages"]

# 目录职责（不要混放）：
#   models/generated/  ← 由 BIsql 编排画布覆盖写入，请勿手改
#   models/staging/    ← 手写：ods 原始表的轻度清洗视图
#   models/marts/      ← 手写：面向应用的宽表与指标
#   models/semantic/   ← 手写：MetricFlow 语义模型（指标口径字典）
models:
  bisql:
    +materialized: table
    staging:
      +materialized: view
