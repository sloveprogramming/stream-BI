[project]
name = "bisql"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pymysql>=1.1",
    "cryptography>=42",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "openpyxl>=3.1",
    "mcp>=1.10,<2",
    "openai>=1.0",
    "sqlglot>=25.0",
    "langgraph>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "alembic>=1.13"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
