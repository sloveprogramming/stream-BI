services:
  db:
    image: postgres:16
    container_name: bisql-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bisql
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bisql
    volumes:
      - bisql_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bisql"]
      interval: 5s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bisql-api
    restart: unless-stopped
    ports:
      - "19530:8000"
    env_file: ../.env
    environment:
      BISQL_DATABASE_URL: postgresql+psycopg://bisql:${POSTGRES_PASSWORD}@db:5432/bisql
    depends_on:
      db:
        condition: service_healthy

volumes:
  bisql_pgdata:

